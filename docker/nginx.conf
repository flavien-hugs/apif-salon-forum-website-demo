# Service statique du site pré-rendu (SvelteKit + adapter-static).
# Les pages sont des fichiers `<route>.html` (trailingSlash: never) ; `404.html`
# est la coquille de repli rendue côté client.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des réponses texte.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # En-têtes de sécurité de base (le TLS est terminé par le reverse proxy amont).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de vie (HEALTHCHECK Docker, supervision).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bundles fingerprintés : cache long et immuable.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pages HTML : jamais mises en cache (elles référencent les bundles fingerprintés).
    # /programme -> programme.html ; / -> index.html ; inconnu -> 404.html (statut 404).
    location / {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
