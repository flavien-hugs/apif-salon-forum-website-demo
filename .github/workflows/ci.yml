name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  # Détermine les applications à (re)construire : une app change -> elle seule ;
  # un package partagé, la racine, le Dockerfile ou ce workflow changent -> toutes ;
  # tag de version -> toutes.
  changes:
    name: Applications concernées
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            salon:
              - 'apps/salon-fintech/**'
            forum:
              - 'apps/forum-fintech/**'
      - id: matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          SALON: ${{ steps.filter.outputs.salon }}
          FORUM: ${{ steps.filter.outputs.forum }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          apps=()
          if [ "$SHARED" = "true" ] || [ "$IS_TAG" = "true" ]; then
            apps=(salon-fintech forum-fintech)
          else
            [ "$SALON" = "true" ] && apps+=(salon-fintech)
            [ "$FORUM" = "true" ] && apps+=(forum-fintech)
          fi
          json=$(printf '%s\n' "${apps[@]}" | sed '/^$/d' | jq -R . | jq -cs .)
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Applications à construire : $json"

  quality:
    name: Qualité (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances du monorepo
        run: npm ci
      - name: Lint (prettier + eslint)
        run: npm run lint
      - name: Vérification des types (svelte-check, toutes les workspaces)
        run: npm run check
      - name: Navigateur de test (chromium)
        run: npx playwright install --with-deps chromium
      - name: Tests (vitest, toutes les workspaces)
        run: npm test

  build:
    name: Build ${{ matrix.app }}
    needs: [changes, quality]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build de production
        run: npm run build -w apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/build
          retention-days: 7

  image:
    name: Image ${{ matrix.app }} (build, vérification, publication GHCR)
    needs: [changes, build]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # 1. Build local (sans push) pour vérifier l'image avant toute publication.
      - name: Build de l'image (vérification)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Vérification de l'image (démarrage, sonde, pages, 404)
        run: |
          docker run -d --rm --name site -p 8080:80 ${{ env.IMAGE }}:ci-${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "APIF"
          curl -fsS http://localhost:8080/auth/connexion | grep -q "Me connecter"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/page-inexistante)" = "404"
          docker stop site
      # 2. Publication : uniquement sur push vers main/dev ou un tag v* (jamais sur PR).
      - name: Connexion à ${{ env.REGISTRY }}
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_GITHUB_TOKEN }}
      - name: Publication de l'image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  deploy:
    name: Déploiement ${{ matrix.app }} (optionnel)
    needs: [changes, image]
    # Actif seulement sur main, et si la variable de dépôt DEPLOY_ENABLED vaut "true"
    # (secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY). Le serveur a cloné la
    # branche `deploy` (compose + deploy.sh). Sinon, à la main : ./deploy.sh <app>.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - name: Mise à jour du site sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_DIR || '/opt/apif-salon-forum-website-demo' }}"
            git pull --ff-only
            ./deploy.sh ${{ matrix.app }}
